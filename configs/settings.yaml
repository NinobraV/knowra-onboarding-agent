# Global configuration settings

api:
  host: "0.0.0.0"
  port: 8000

pinecone:
  index_name: "knowra-onboarding"
  dimension: 1536
  metric: "cosine"

embedding:
  model: "text-embedding-ada-002"
  batch_size: 100

llm:
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 2000

chunking:
  chunk_size: 1000
  chunk_overlap: 200
  strategy: "hybrid_recursive"
