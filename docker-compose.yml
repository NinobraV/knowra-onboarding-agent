version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=sk-4YIDvGCBj5mv1Qzj2E9DFg
      - OPENAI_BASE_URL=https://aiportalapi.stu-platform.live/jpe
      - OPENAI_EMBEDDING_API_KEY=sk-Qu1_uJNYuPFtU62uu8wOWg
      - PINECONE_API_KEY=pcsk_5EXuVd_SnvVpSXTvG5gkU7GseN5aYAhc7TNG5dUZBkodnNiAi2e1pMez6HfK6thNfeLsYM
      - PINECONE_ENVIRONMENT=us-east-1
      - PINECONE_INDEX_NAME=knowra-onboarding
      - PORT=8000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data/raw
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./configs:/app/configs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

networks:
  default:
    name: knowra-network
