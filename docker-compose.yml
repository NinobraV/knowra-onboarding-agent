version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_BASE_URL={OPENAI_BASE_URL}
      - OPENAI_API_KEY={OPENAI_API_KEY}
      - OPENAI_EMBEDDING_API_KEY={OPENAI_EMBEDDING_API_KEY}
      - PINECONE_API_KEY={PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT={PINECONE_ENVIRONMENT}
      - PINECONE_INDEX_NAME={PINECONE_INDEX_NAME}
      - PORT=8000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data/raw
      - VECTOR_STORE_DIR=/app/.vectorstore
      - CHUNK_SIZE=1000                    # Size of text chunks (increase for larger context)
      - CHUNK_OVERLAP=200                   # Overlap between chunks (preserves context)
      - RETRIEVER_K=5                       # Number of documents to retrieve per query
      - MEMORY_WINDOW=10                    # Number of messages to keep in conversation memory
      - AUTO_REBUILD_ENABLED=false          # Auto-rebuild vector store when files change
      
      # ===== Optional: Advanced Chunking (improve context understanding) =====
      - CHUNK_ADD_SECTION_HEADERS=true      # Prepend section headers to chunks
      - CHUNK_EXTRACT_METADATA=true         # Extract YAML frontmatter metadata
      
      # ===== Optional: Streaming Configuration =====
      - SSE_DELAY=0.01                      # Delay between streaming chunks (seconds)
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./configs:/app/configs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

networks:
  default:
    name: knowra-network
